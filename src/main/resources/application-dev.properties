# PostgreSQL для локальной разработки
spring.datasource.url=jdbc:postgresql://localhost:5432/reservation_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate только проверяет схему — миграции выполняет Flyway
ddl-auto=validate

# документация доступна в dev
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
# показывать SQL в логах — только для dev!
spring.jpa.show-sql=true

# Только для локальной разработки. Production использует JWT_SECRET.
app.jwt.secret=dev-secret-key-for-jwt-signing-must-be-at-least-256-bits-long-0123456789