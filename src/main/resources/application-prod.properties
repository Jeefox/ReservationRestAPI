# Все production-подключения и секреты поступают извне.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# документация в проде закрыта
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.jwt.secret=${JWT_SECRET}

app.kafka.topic=${KAFKA_RESERVATIONS_TOPIC:reservations-prod}
app.kafka.group-id=${KAFKA_RESERVATIONS_GROUP:reservation-service-prod}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
app.kafka.replicas=${KAFKA_REPLICAS}
