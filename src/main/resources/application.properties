spring.application.name=reservation-system
server.port=8085

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jpa.open-in-view=false

app.jwt.expiration=3600000

spring.kafka.bootstrap-servers=localhost:9092
app.kafka.topic=${KAFKA_RESERVATIONS_TOPIC:reservations}
app.kafka.group-id=${KAFKA_RESERVATIONS_GROUP:reservation-service}
app.kafka.concurrency=${KAFKA_CONCURRENCY:2}
app.kafka.partitions=${KAFKA_PARTITIONS:3}
app.kafka.replicas=${KAFKA_REPLICAS:1}
app.kafka.retry-delay-ms=${KAFKA_RETRY_DELAY_MS:1000}
app.kafka.retry-attempts=${KAFKA_RETRY_ATTEMPTS:2}

app.outbox.batch-size=${OUTBOX_BATCH_SIZE:10}
app.outbox.max-attempts=${OUTBOX_MAX_ATTEMPTS:5}
app.outbox.lease=${OUTBOX_LEASE:PT10M}
app.outbox.retry-delay=${OUTBOX_RETRY_DELAY:PT10S}
app.outbox.publish-delay-ms=${OUTBOX_PUBLISH_DELAY_MS:5000}
